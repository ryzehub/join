<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }
    .box { text-align: center; }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Connecting...</p>
  </div>
  <script>
    // ── FILL THESE TWO LINES ──────────────────────────────────────────
    const PLACE_ID    = "109983668079237";       // number from game URL
    const SERVER_CODE = "4294639088";    // code from private server link
    // ─────────────────────────────────────────────────────────────────

    const uri = `roblox://experiences/start?placeId=${PLACE_ID}&privateServerLinkCode=${SERVER_CODE}`;

    setTimeout(() => {
      const frame = document.createElement('iframe');
      frame.style.display = 'none';
      frame.src = uri;
      document.body.appendChild(frame);
      setTimeout(() => { window.location.href = uri; }, 400);
      document.getElementById('msg').textContent = 'Almost there...';
    }, 1200);

    setTimeout(() => {
      window.location.replace("https://www.roblox.com");
    }, 3500);
  </script>
</body>
</html>
